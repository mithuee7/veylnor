services:
  - type: web
    name: veylnor-reel-generator
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: main
    buildCommand: apt-get update && apt-get install -y ffmpeg && npm install && npm run build
    startCommand: NODE_OPTIONS=--max-old-space-size=128 UV_THREADPOOL_SIZE=1 npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
    autoDeploy: true
